name: Compilar VOXLATAM APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias y compilar interfaz VOXLATAM
        run: |
          npm install
          npm run build

      - name: Generar proyecto nativo Android con Capacitor
        run: |
          npx cap add android

      - name: Configurar permisos de microfono e icono AMOLED
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil
          python3 scripts/setup-android.py

      - name: Compilar instalador VOXLATAM.apk
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../VOXLATAM.apk

      - name: Guardar VOXLATAM.apk en Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VOXLATAM-Instalador-Android
          path: VOXLATAM.apk
          if-no-files-found: error

      - name: Publicar descarga directa en Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VOXLATAM APK v1.0.${{ github.run_number }}
          body: "Instalador Android de VOXLATAM (100% Gratis, Motor IA en el telefono, Negro AMOLED + Modo Claro)."
          files: VOXLATAM.apk
